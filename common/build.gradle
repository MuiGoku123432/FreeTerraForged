architectury {
    common("fabric", "neoforge")
}

loom {
    accessWidenerPath = file("src/main/resources/freeterraforged.accesswidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "com.github.glitchfiend:TerraBlender-neoforge:${rootProject.minecraft_version}-${rootProject.terrablender_version}"
	compileOnly "com.electronwill.night-config:toml:3.6.7"
	modCompileOnly "maven.modrinth:biolith:3.0.14-neoforge"
	modCompileOnly "maven.modrinth:lithostitched:1.8.0+beta6-neoforge-21.1"
	compileOnly "dev.architectury:architectury-injectables:1.0.13"
}

repositories {
    maven { url "https://api.modrinth.com/maven" }
}

// Runs real common climate/codec code with a test-only registry binding, without launching Minecraft.
// This does not substitute for loader, saved-world, or client/server acceptance tests.
tasks.register("latitudeTest", JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "etcodehome.freeterraforged.world.worldgen.cell.climate.LatitudeClimateTest"
    workingDir = layout.buildDirectory.dir("latitude-test").get().asFile
    doFirst { workingDir.mkdirs() }
}
check.dependsOn tasks.named("latitudeTest")

remapJar {
    archiveClassifier.set("${rootProject.minecraft_version}")
}

subprojects {
    afterEvaluate {
        if (plugins.hasPlugin("architectury-plugin")) {
            loom {
                runConfigs.configureEach {
                    // Forces Log4j to output DEBUG level messages
                    systemProperty "log4j2.debug", "true"
                    systemProperty "fabric.development", "true"

                    // Standard fix to prevent Loom from swallowing terminal colors/output
                    vmArg "-Dterminal.jline=false"
                    vmArg "-Dlog4j.skipJansi=true"
                }
            }
        }
    }
}

tasks.register("cleanStaleDefaultPresetResources", Delete) {
    delete(layout.buildDirectory.dir("resources/main/ftf_default_preset"))
}

tasks.withType(Jar).configureEach {
    exclude("ftf_default_preset/**")
}

processResources {
    dependsOn tasks.named("cleanStaleDefaultPresetResources")
    filesMatching("pack.mcmeta") {
        expand project.properties
    }
}
