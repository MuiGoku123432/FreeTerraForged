architectury {
    common("fabric", "neoforge")
}

loom {
    accessWidenerPath = file("src/main/resources/freeterraforged.accesswidener")
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "com.github.glitchfiend:TerraBlender-neoforge:${rootProject.minecraft_version}-${rootProject.terrablender_version}"
	compileOnly "com.electronwill.night-config:toml:3.6.7"
	modCompileOnly "maven.modrinth:biolith:3.0.14-neoforge"
	modCompileOnly "maven.modrinth:lithostitched:1.8.0+beta6-neoforge-21.1"
	compileOnly "dev.architectury:architectury-injectables:1.0.13"
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
}

tasks.withType(Test).configureEach {
    maxHeapSize = '2G'
    systemProperty 'ftf.captureBaseline', System.getProperty('ftf.captureBaseline', 'false')
    systemProperty 'ftf.render', System.getProperty('ftf.render', 'false')
    testLogging { events 'passed', 'skipped', 'failed' }
}

// Gate tests only. @Tag("probe") (investigation probes, timing checks) and @Tag("slow") (long sweeps) run on demand
// with probeTest. Test classes run in parallel JVMs (forks share no in-memory state).
test {
    useJUnitPlatform { excludeTags 'probe', 'slow' }
    maxParallelForks = Math.max(1, Math.min(4, Runtime.runtime.availableProcessors().intdiv(2)))
}

// On-demand probes: ./gradlew :common:probeTest [--tests '*BiomeCensusProbe']
tasks.register('probeTest', Test) {
    description = 'Runs the @Tag("probe") and @Tag("slow") tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'probe', 'slow' }
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

remapJar {
    archiveClassifier.set("${rootProject.minecraft_version}")
}

subprojects {
    afterEvaluate {
        if (plugins.hasPlugin("architectury-plugin")) {
            loom {
                runConfigs.configureEach {
                    // Forces Log4j to output DEBUG level messages
                    systemProperty "log4j2.debug", "true"
                    systemProperty "fabric.development", "true"

                    // Standard fix to prevent Loom from swallowing terminal colors/output
                    vmArg "-Dterminal.jline=false"
                    vmArg "-Dlog4j.skipJansi=true"
                }
            }
        }
    }
}

processResources {
    filesMatching("pack.mcmeta") {
        expand project.properties
    }
}

test {
    useJUnitPlatform()
}
