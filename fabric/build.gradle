plugins {
    id "com.gradleup.shadow" version "9.2.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    runs {
        server {
            // Remove "nogui" so the vanilla Swing interface opens
            programArgs.remove("nogui")
        }
        benchmarkServer {
            server()
            name "Run Headless Worldgen Benchmark Server"
            runDir "build/benchmark-run"
            programArg "nogui"
            vmArg "-Xmx4G"
            vmArg "-Djava.awt.headless=true"
            vmArg "-Dfreeterraforged.benchmark.auto=true"
            vmArg "-Dfreeterraforged.benchmark.radius=${project.findProperty('ftfBenchmarkRadius') ?: '10'}"
            vmArg "-Dfreeterraforged.benchmark.x=${project.findProperty('ftfBenchmarkX') ?: '100000'}"
            vmArg "-Dfreeterraforged.benchmark.z=${project.findProperty('ftfBenchmarkZ') ?: '100000'}"
            vmArg "-Dfreeterraforged.benchmark.exit=true"
            vmArg "-Dfreeterraforged.benchmark.exact=${project.findProperty('ftfBenchmarkExact') ?: 'false'}"
            vmArg "-Dfreeterraforged.benchmark.validateHighlands=${project.findProperty('ftfValidateHighlands') ?: 'false'}"
            vmArg "-Dfreeterraforged.benchmark.nearestRiver=${project.findProperty('ftfNearestRiver') ?: 'false'}"
            vmArg "-Dfreeterraforged.structureProbe=${project.findProperty('ftfStructureProbe') ?: 'false'}"
        }
        presetTestServer {
            server()
            name "Run Headless Preset Validation Server (Fabric)"
            runDir "build/preset-test-run"
            programArg "nogui"
            vmArg "-Xmx4G"
            vmArg "-Djava.awt.headless=true"
            vmArg "-Dfreeterraforged.test.preset=true"
            vmArg "-Dfreeterraforged.test.preset.exit=true"
            vmArg "-Dfreeterraforged.test.heightmap.dir=${project.rootDir.absolutePath.replace('\\', '/')}/build/reports/preset-test-heightmaps"
        }
    }
}

configurations {
    common
    shadowCommon
    architecturyTransformerClasspath
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    architecturyTransformerClasspath.extendsFrom compileClasspath
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    modCompileOnly "maven.modrinth:biolith:3.0.14-fabric"
    architecturyTransformerClasspath "com.github.glitchfiend:TerraBlender-neoforge:${rootProject.minecraft_version}-${rootProject.terrablender_version}"
    architecturyTransformerClasspath "maven.modrinth:biolith:3.0.14-neoforge"
    architecturyTransformerClasspath "maven.modrinth:lithostitched:1.8.0+beta4-neoforge-21.1"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    group = "fabric"
    description = "Runs the remapped production artifact with Fabric's production server launcher"
    loaderVersion = rootProject.fabric_loader_version
    minecraftVersion = rootProject.minecraft_version
    runDir = file("run")
    jvmArgs.add("-Xmx4G")
}

repositories {
    maven { url "https://api.modrinth.com/maven" }
}

tasks.named("runBenchmarkServer").configure {
    doFirst {
        def benchDir = file("build/benchmark-run")
        delete(new File(benchDir, "perf-reports/structure-probe.json"))
        delete(new File(benchDir, "world"))
        benchDir.mkdirs()
        new File(benchDir, "eula.txt").text = "eula=true\n"
        new File(benchDir, "server.properties").text = """\
level-type=freeterraforged\\:freeterraforged
level-seed=${project.findProperty('ftfBenchmarkSeed') ?: '-7442486958049957310'}
online-mode=false
server-ip=127.0.0.1
server-port=0
spawn-protection=0
view-distance=10
simulation-distance=10
sync-chunk-writes=false
max-tick-time=-1
""".stripIndent()
        if (project.hasProperty('ftfBenchmarkPresetPack')) {
            copy {
                from rootProject.file(project.property('ftfBenchmarkPresetPack'))
                into new File(benchDir, "world/datapacks/rolling-highlands")
            }
            new File(benchDir, "server.properties") << "initial-enabled-packs=vanilla,freeterraforged:ftf_default_preset,file/rolling-highlands\n"
        }
    }
    doLast {
        if ((project.findProperty('ftfStructureProbe') ?: 'false').toString().toBoolean()) {
            def reportFile = file("build/benchmark-run/perf-reports/structure-probe.json")
            if (!reportFile.isFile()) throw new GradleException("Structure probe did not produce a report")
            def report = new groovy.json.JsonSlurper().parse(reportFile)
            if (report.passed != true || report.harnessVersion != 3 || report.heightChecks < 240 || report.blockChecks < 2949120) {
                throw new GradleException("Structure probe failed or did not complete: ${report.failures}")
            }
        }
    }
}

tasks.named("runPresetTestServer").configure {
    doFirst {
        def testDir = file("build/preset-test-run")
        delete(testDir)
        testDir.mkdirs()
        new File(testDir, "eula.txt").text = "eula=true\n"
        new File(testDir, "server.properties").text = """\
level-type=freeterraforged\\:freeterraforged
level-seed=${project.findProperty('ftfTestSeed') ?: '1337'}
online-mode=false
spawn-protection=0
view-distance=10
simulation-distance=10
sync-chunk-writes=false
max-tick-time=-1
""".stripIndent()
    }
}

tasks.register("runPresetTest") {
    group = "verification"
    description = "Runs the headless FreeTerraForged preset persistence and resolution tests"
    dependsOn(":common:test", "runPresetTestServer")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

shadow {
    addShadowVariantIntoJavaComponent = false
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set("fabric-${rootProject.minecraft_version}")
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
